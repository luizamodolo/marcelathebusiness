<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M4Melo Dance</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

  :root{
    --bg: #FFFFFF;
    --bg-alt: #F4F4F4;
    --ink: #161616;
    --ink-soft: #63615F;
    --accent: #7A1F2B;
    --accent-deep: #591620;
    --accent-pale: #F5E9EA;
    --line: #E2E2E2;
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }

  p{ line-height: 1.7; color: var(--ink-soft); margin: 0; font-size: 0.98rem; }
  a{ color: inherit; }
  .mono{ font-family: 'Space Mono', monospace; letter-spacing: 0.05em; }
  .wrap{ max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- nav ---------- */
  header{ border-bottom: 1px solid var(--line); padding: 18px 24px; }
  nav{ max-width: 1160px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .logo{ font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 1.5rem; color: var(--accent); text-decoration: none; letter-spacing: 0.02em; display: inline-flex; align-items: center; }
  .logo-img{ height: 60px; width: auto; display: block; }
  .nav-links{ display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; row-gap: 10px; }
  @media (max-width: 480px){
    .nav-links{ gap: 16px; justify-content: center; }
  }
  .nav-links a{
    font-family: 'Space Mono', monospace; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em;
    text-decoration: none; color: var(--ink); padding-bottom: 3px; border-bottom: 1px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .nav-links a:hover{ color: var(--accent); border-color: var(--accent); }
  .nav-actions{ display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent-deep); outline-offset: 2px;
  }

  .btn{
    font-family: 'Space Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    border-radius: 2px; padding: 11px 20px; cursor: pointer; text-decoration: none; display: inline-block;
    border: 1px solid var(--accent-deep); transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-solid{ background: var(--accent-deep); color: #fff; }
  .btn-solid:hover{ background: var(--accent); border-color: var(--accent); }
  .btn-outline{ background: transparent; color: var(--accent-deep); }
  .btn-outline:hover{ background: var(--accent-pale); }
  .btn-small{ padding: 8px 16px; font-size: 0.74rem; }
  .btn[disabled]{ opacity: 0.5; cursor: default; }

  .notice-bar{ text-align: center; background: var(--ink); color: #fff; font-family: 'Space Mono', monospace; font-size: 0.8rem; letter-spacing: 0.04em; padding: 9px 16px; transition: opacity 0.4s ease; }

  /* ---------- hero ---------- */
  .hero{ padding: 90px 24px 76px; text-align: center; position: relative; overflow: hidden; }
  .hero-content{ position: relative; z-index: 1; }
  .hero .eyebrow{ display: block; font-family: 'Space Mono', monospace; font-size: 0.8rem; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; margin-bottom: 22px; }
  .hero h1{ font-family: 'Poppins', 'Work Sans', sans-serif; font-size: clamp(2.4rem, 5.6vw, 3.9rem); font-style: normal; font-weight: 800; letter-spacing: -0.01em; color: var(--ink); line-height: 1.14; text-align: center; }
  .hero h1 .hero-four{ display: inline-block; font-variant-numeric: lining-nums; transform: translateY(-0.04em); }
  .hero .sub strong{ color: var(--accent-deep); }
  .hero .sub a{ color: var(--accent-deep); font-weight: 700; text-decoration: underline; }
  .hero .sub{ max-width: 520px; margin: 24px auto 0; font-size: 1.05rem; }

  /* ---------- floating seashells ---------- */
  .panel{ position: relative; overflow: hidden; }
  .panel > .wrap{ position: relative; z-index: 1; }
  .floating-shell{ position: absolute; z-index: 0; pointer-events: none; opacity: 0.85; height: auto; }
  .shell-1{ width: 68px; top: 54px; left: 5%; animation: shellFloatA 13s ease-in-out infinite; }
  .shell-2{ width: 46px; top: 130px; right: 8%; animation: shellFloatB 15s ease-in-out infinite 1.4s; }
  .shell-3{ width: 58px; bottom: 54px; left: 10%; animation: shellFloatC 12s ease-in-out infinite 0.6s; }
  .shell-4{ width: 42px; bottom: 96px; right: 5%; animation: shellFloatA 16s ease-in-out infinite 2.2s; }
  .shell-5{ width: 34px; top: 26px; right: 22%; animation: shellFloatB 11s ease-in-out infinite 0.3s; }
  .shell-6{ width: 52px; top: 190px; left: 21%; animation: shellFloatC 14s ease-in-out infinite 3s; }
  @keyframes shellFloatA{
    0%{ transform: translate(0, 0) rotate(0deg); }
    25%{ transform: translate(30px, -60px) rotate(12deg); }
    50%{ transform: translate(-16px, -110px) rotate(-8deg); }
    75%{ transform: translate(-38px, -50px) rotate(14deg); }
    100%{ transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes shellFloatB{
    0%{ transform: translate(0, 0) rotate(0deg); }
    30%{ transform: translate(-40px, -45px) rotate(-14deg); }
    60%{ transform: translate(24px, -95px) rotate(10deg); }
    85%{ transform: translate(40px, -30px) rotate(-6deg); }
    100%{ transform: translate(0, 0) rotate(0deg); }
  }
  @keyframes shellFloatC{
    0%{ transform: translate(0, 0) rotate(0deg); }
    20%{ transform: translate(20px, -35px) rotate(8deg); }
    45%{ transform: translate(45px, -85px) rotate(-12deg); }
    70%{ transform: translate(-30px, -70px) rotate(9deg); }
    100%{ transform: translate(0, 0) rotate(0deg); }
  }
  @media (max-width: 900px){
    .floating-shell{ display: none; }
  }
  .hero-ctas{ margin-top: 32px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .divider{ width: 46px; height: 1px; background: var(--accent); margin: 30px auto 0; }

  /* ---------- section chrome ---------- */
  section.panel{ padding: 78px 24px; }
  section.panel.alt{ background: var(--bg-alt); }
  .section-head{ text-align: center; max-width: 600px; margin: 0 auto 46px; }
  .section-head .kicker{ font-family: 'Space Mono', monospace; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 10px; }
  .section-head h2{ font-size: clamp(1.9rem, 4vw, 2.5rem); font-style: italic; color: var(--ink); }
  .section-head p{ margin-top: 14px; }

  .ph{ border-bottom: 1px dashed var(--accent); color: var(--accent-deep); font-weight: 600; white-space: nowrap; }
  .note{ text-align: center; font-family: 'Space Mono', monospace; font-size: 0.82rem; color: var(--accent-deep); background: var(--accent-pale); border-radius: 3px; padding: 10px 16px; max-width: 560px; margin: 44px auto 0; }
  .free-event-banner{
    text-align: center; max-width: 620px; margin: 40px auto 0; padding: 26px 30px; border-radius: 8px;
    border: 2px dashed var(--accent-deep); background: var(--accent-pale);
  }
  .free-event-badge{
    display: inline-block; font-family: 'Space Mono', monospace; font-size: 0.72rem; text-transform: uppercase;
    letter-spacing: 0.1em; color: #fff; background: var(--accent-deep); border-radius: 999px; padding: 4px 14px; margin-bottom: 12px;
  }
  .free-event-banner h3{ font-size: 1.4rem; font-style: italic; color: var(--accent-deep); margin-bottom: 8px; }
  .free-event-banner p{ font-size: 0.95rem; }
  .free-event-rsvp-form{ display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .free-event-rsvp-form input{
    font-family: 'Work Sans', sans-serif; font-size: 0.92rem; padding: 9px 12px; border-radius: 3px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); flex: 1 1 160px; max-width: 220px;
  }
  .free-event-banner .form-msg{ margin-top: 10px; font-size: 0.85rem; color: var(--accent-deep); }

  /* ---------- tabs ---------- */
  .tabs{ display: flex; justify-content: center; gap: 8px; margin-bottom: 44px; }
  .tab-btn{
    font-family: 'Space Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 9px 22px; cursor: pointer; color: var(--ink-soft);
  }
  .tab-btn.active{ border-color: var(--accent-deep); color: var(--accent-deep); background: var(--accent-pale); }
  .tab-panel[hidden]{ display: none; }

  /* ---------- class schedule cards ---------- */
  .class-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
  .class-card{ border: 1px solid var(--line); border-radius: 4px; padding: 24px 22px; display: flex; flex-direction: column; gap: 8px; }
  .class-level{
    align-self: flex-start; font-family: 'Space Mono', monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent-deep); background: var(--accent-pale); padding: 3px 10px; border-radius: 999px;
  }
  .class-card h3{ font-size: 1.3rem; font-style: italic; }
  .class-meta{ font-size: 0.92rem; }
  .class-price{ margin-top: auto; font-family: 'Space Mono', monospace; color: var(--accent-deep); font-size: 1rem; }

  /* ---------- schedule: one square per date ---------- */
  .schedule-groups{ display: flex; flex-direction: column; gap: 36px; }
  .schedule-group-head{ margin-bottom: 16px; }
  .schedule-group-head h3{ font-size: 1.25rem; font-style: italic; margin: 6px 0 4px; }
  .schedule-group-head .class-meta{ margin: 2px 0; }
  .schedule-group-head .class-price{ font-family: 'Space Mono', monospace; color: var(--accent-deep); font-size: 0.92rem; margin-top: 4px; }
  .date-grid{ display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .date-square{
    font-family: 'Space Mono', monospace; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    width: 84px; height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease; color: var(--ink);
  }
  .date-square:hover{ border-color: var(--accent-deep); background: var(--accent-pale); transform: translateY(-2px); }
  .date-square .date-month{ font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .date-square .date-day{ font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.7rem; color: var(--accent-deep); line-height: 1.15; }
  .date-square .date-dow{ font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; }

  /* ---------- pricing ---------- */
  .price-block{ margin-bottom: 56px; }
  .price-block:last-child{ margin-bottom: 0; }
  .price-block h3{ text-align: center; font-size: 1.5rem; font-style: italic; margin-bottom: 22px; }
  .price-note{ text-align: center; font-size: 0.86rem; margin-bottom: 32px; }
  .price-row{ display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
  .info-note{ margin-top: 32px; padding: 26px 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--accent-pale); text-align: center; }
  .info-note:first-of-type{ margin-top: 44px; }
  .info-note h3{ font-size: 1.15rem; font-style: italic; margin-bottom: 8px; }
  .info-note p{ font-size: 0.9rem; margin-bottom: 0; }
  .info-note p + p{ margin-top: 10px; }
  .info-note .btn{ margin-top: 16px; }
  .price-card{ border: 1px solid var(--line); border-radius: 4px; padding: 26px 20px; text-align: center; }
  .price-card .plan-name{ font-size: 1rem; font-weight: 600; margin-bottom: 10px; }
  .price-card .amount{ font-family: 'Cormorant Garamond', serif; font-size: 2.1rem; color: var(--accent-deep); font-style: italic; }
  .price-card .amount sub{ font-family: 'Work Sans', sans-serif; font-size: 0.85rem; color: var(--ink-soft); }
  .price-card .fine{ font-size: 0.82rem; margin: 8px 0 18px; }
  .welcome-card{ max-width: 320px; margin: 0 auto; border: 1px solid var(--accent); border-radius: 4px; padding: 30px 26px; text-align: center; }

  /* ---------- instructor ---------- */
  .instructor-grid{ display: grid; grid-template-columns: 260px 1fr; gap: 50px; align-items: center; }
  .instructor-photo{
    aspect-ratio: 4/5; border: 1px solid var(--line); background: var(--bg-alt); display: flex; align-items: center; justify-content: center;
    color: var(--accent-deep); font-family: 'Space Mono', monospace; font-size: 0.85rem; text-align: center; padding: 20px; overflow: hidden;
  }
  .instructor-photo img{ width: 100%; height: 100%; object-fit: cover; display: block; }
  .instructor-text h2{ font-size: 2rem; font-style: italic; margin-bottom: 16px; }
  .instructor-text p + p{ margin-top: 14px; }
  @media (max-width: 720px){
    .instructor-grid{ grid-template-columns: 1fr; text-align: center; }
    .instructor-photo{ width: 220px; margin: 0 auto; }
  }

  /* ---------- photo gallery ---------- */
  .gallery-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
  .gallery-tile{
    aspect-ratio: 1/1; border: 1px solid var(--line); background: var(--bg-alt); display: flex; align-items: center; justify-content: center;
    color: var(--accent-deep); font-family: 'Space Mono', monospace; font-size: 0.8rem; text-align: center; border-radius: 4px;
    overflow: hidden;
  }
  .gallery-tile img{ width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- contact / buy flow ---------- */
  .contact-wrap{ max-width: 600px; margin: 0 auto; display: grid; gap: 22px; }
  form.signup-form{ border: 1px solid var(--line); border-radius: 4px; padding: 32px; display: grid; gap: 16px; }
  .field{ display: grid; gap: 6px; text-align: left; }
  .field label{ font-family: 'Space Mono', monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-deep); }
  .checkbox-field label{ display: flex; align-items: center; gap: 8px; text-transform: none; font-family: 'Work Sans', sans-serif; font-size: 0.88rem; color: var(--ink); letter-spacing: 0; }
  .checkbox-field input[type="checkbox"]{ width: 16px; height: 16px; flex-shrink: 0; }
  .field input, .field select, .field textarea{
    font-family: 'Work Sans', sans-serif; font-size: 0.98rem; padding: 10px 13px; border-radius: 3px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  .field textarea{ min-height: 88px; resize: vertical; }
  .field-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px){ .field-row{ grid-template-columns: 1fr; } }
  .form-msg{ text-align: center; font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--accent-deep); min-height: 1.2em; }
  .signup-counter{ text-align: center; font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--ink-soft); }

  .pay-box{
    border: 1px solid var(--accent); border-radius: 4px; padding: 26px 28px; text-align: center; background: var(--accent-pale);
  }
  .pay-box h3{ font-size: 1.3rem; font-style: italic; margin-bottom: 10px; color: var(--accent-deep); }
  .pay-box p{ font-size: 0.92rem; }
  .pay-box .pay-line{ font-family: 'Space Mono', monospace; font-size: 1rem; color: var(--ink); margin: 14px 0; }
  .pay-box .pay-line b{ color: var(--accent-deep); }
  .pay-box .pay-line[data-pay-method]{ display: none; }
  .pay-box .pay-line[data-pay-method].is-active{ display: block; }
  .pay-method-toggle{ display: flex; justify-content: center; gap: 8px; margin: 16px 0 4px; flex-wrap: wrap; }
  .pay-method-btn{
    font-family: 'Space Mono', monospace; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 18px;
    cursor: pointer; color: var(--ink-soft); transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .pay-method-btn:hover{ border-color: var(--accent-deep); color: var(--accent-deep); }
  .pay-method-btn.is-active{ background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
  .pay-link{ color: var(--accent-deep); font-weight: 700; text-decoration: underline; }
  .copy-btn{
    font-family: 'Space Mono', monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
    background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin-left: 6px;
    cursor: pointer; color: var(--ink-soft); vertical-align: middle;
  }
  .copy-btn:hover{ border-color: var(--accent-deep); color: var(--accent-deep); }
  .copy-msg{ font-size: 0.76rem; color: var(--accent-deep); margin-left: 4px; }
  .pay-box .pay-deadline{ font-size: 0.84rem; background: var(--accent-pale); border-radius: 4px; padding: 10px 12px; color: var(--accent-deep); }
  .pay-policy{ background: var(--accent-pale); border-radius: 4px; padding: 12px 14px; margin: 14px 0; }
  .pay-policy p{ font-size: 0.84rem; color: var(--accent-deep); margin: 0; }
  .pay-policy p + p{ margin-top: 8px; }
  .cancel-block{ margin-top: 16px; text-align: center; }
  .link-btn{ background: none; border: none; padding: 0; font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
  .link-btn:hover{ color: var(--accent-deep); }
  .cancel-form{ margin-top: 12px; text-align: left; }
  .cancel-note{ font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 8px; }
  .cancel-row{ display: flex; gap: 8px; flex-wrap: wrap; }
  .cancel-row input{ flex: 1; min-width: 160px; padding: 8px 10px; border-radius: 3px; border: 1px solid var(--line); font-family: 'Work Sans', sans-serif; }
  #cancel-results{ display: grid; gap: 12px; margin-top: 4px; }
  .cancel-result-card{ background: var(--bg-alt); border-radius: 4px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cancel-result-info{ flex: 1; min-width: 160px; }
  .cancel-result-name{ font-weight: 600; color: var(--ink); font-size: 0.95rem; margin-bottom: 2px; }
  .cancel-result-meta{ font-size: 0.82rem; color: var(--ink-soft); }
  .cancel-empty{ text-align: center; font-size: 0.88rem; color: var(--ink-soft); }
  .cancel-msg{ font-family: 'Space Mono', monospace; font-size: 0.78rem; margin-top: 8px; color: var(--accent-deep); min-height: 1.2em; }
  .cancel-result-actions{ display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .cancel-btn-row{ display: flex; gap: 8px; flex-wrap: wrap; }
  .change-date-select{ padding: 7px 10px; border-radius: 3px; border: 1px solid var(--line); font-family: 'Work Sans', sans-serif; font-size: 0.85rem; }
  .cancel-inline-note{ font-size: 0.82rem; color: var(--ink-soft); font-style: italic; }

  /* ---------- membership credit lookup (public) ---------- */
  .credit-result-card{ background: var(--bg-alt); border-radius: 4px; padding: 14px 16px; margin-bottom: 8px; }
  .credit-result-top{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .credit-result-info{ flex: 1; min-width: 160px; }
  .credit-date-picker{ margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .credit-date-picker-label{ font-size: 0.78rem; color: var(--ink-soft); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; font-family: 'Space Mono', monospace; }
  .credit-date-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 0.88rem; }
  .credit-date-row.credit-date-booked{ color: var(--accent-deep); font-weight: 600; }
  .credit-date-row .btn[disabled]{ opacity: 0.4; cursor: not-allowed; }
  .credit-balance{
    font-family: 'Space Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 4px 12px; border-radius: 999px; background: #E4F1E6; color: #276A3B; white-space: nowrap;
  }
  .credit-balance.low{ background: #F6E2C8; color: #8A5A16; }
  .credit-balance.zero{ background: #EDEDED; color: #6B6B6B; }
  .credits-cta{ text-align: center; margin-top: 14px; }

  /* ---------- staff area ---------- */
  .staff-section{ max-width: 640px; margin: 0 auto; }
  .staff-card{ border: 1px solid var(--line); border-radius: 4px; padding: 28px; }
  .staff-card h3{ font-size: 1.25rem; font-style: italic; margin-bottom: 6px; }
  .staff-card .desc{ font-size: 0.9rem; margin-bottom: 16px; }
  .gate-row{ display: flex; gap: 8px; flex-wrap: wrap; }
  .gate-row input{ flex: 1; min-width: 140px; padding: 9px 12px; border-radius: 3px; border: 1px solid var(--line); font-family: 'Work Sans', sans-serif; }
  .gate-msg{ font-family: 'Space Mono', monospace; font-size: 0.78rem; margin-top: 8px; color: var(--accent-deep); min-height: 1.2em; }
  .portal-panel{ margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .portal-panel h4{ font-family: 'Space Mono', monospace; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); margin-bottom: 10px; }

     2. Add an Email Service (connect Marcela's Gmail) → copy its Service ID below.
     3. Create an Email Template with variables {{to_name}}, {{to_email}}, {{class_info}}, {{plan}}
        → copy its Template ID below.
     4. Account → General → copy your Public Key below.
     Until all three are filled in (not left as 'YOUR_...'), confirmation emails are simply skipped —
     everything else on the site works fine either way. */
  var EMAILJS_PUBLIC_KEY = 'YOUR_PUBLIC_KEY';
  var EMAILJS_SERVICE_ID = 'YOUR_SERVICE_ID';
  var EMAILJS_TEMPLATE_ID = 'YOUR_TEMPLATE_ID';

  /* ---------------- Venmo pay link ----------------
     Once you have Marcela's Venmo @username, put it below (no @ symbol needed).
     Tapped on a phone with the Venmo app installed, this opens the app straight to a
     payment screen with Marcela and the amount already filled in. Without the app
     (e.g. on a computer), it opens her Venmo profile page in the browser instead —
     still faster than typing her name in by hand, just not pre-filled there. */
  var VENMO_USERNAME = 'm4melodance';

  function venmoPayLink(amount, note){
    if(!VENMO_USERNAME || VENMO_USERNAME.indexOf('YOUR_') === 0) return '';
    var base = 'https://venmo.com/u/' + encodeURIComponent(VENMO_USERNAME);
    var params = 'txn=pay&amount=' + encodeURIComponent(amount) + '&note=' + encodeURIComponent(note);
    return base + '?' + params;
  }

  function amountFromPlan(planText){
    var m = /\$([0-9]+(\.[0-9]+)?)/.exec(planText || '');
    return m ? m[1] : '';
  }

     1. Make a new Google Sheet (any name).
     2. Extensions → Apps Script. Delete the placeholder code and paste in the script from Code.gs (sent alongside this file).
     3. In that script, change API_KEY to a secret you make up, then copy the SAME secret into SHEETS_API_KEY below.
     4. Deploy → New deployment → type "Web app" → Execute as "Me" → Who has access "Anyone" → Deploy.
     5. Copy the Web app URL it gives you into SHEETS_WEB_APP_URL below.
     Until both are filled in (not left as 'YOUR_...'), the site works exactly as it does now — signups just stay local

    if(!sheetsConfigured() || !window.fetch) return;
    payload.key = SHEETS_API_KEY;

  function normalizeSheetRow(r){
    function truthy(v){ return v === true || v === 'true' || v === 'TRUE' || v === 1; }
    return {
      id: r.id, name: r.name, email: r.email, phone: r.phone, location: r.location,

    };

  function t(key){
    var table = STRINGS[currentLang] || STRINGS.en;
    var val = table[key];
    if(val == null) val = STRINGS.en[key];
    return val == null ? key : val;
  }

  function tf(key, params){
    var str = t(key);
    if(!params) return str;
    Object.keys(params).forEach(function(p){
      str = str.split('{' + p + '}').join(params[p]);
    });
    return str;
  }

  function setLang(lang){
    if(lang !== 'en' && lang !== 'pt') return;
    currentLang = lang;
    try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){}
    render();
  }

  function inviteSmsHref(){
    return 'sms:?body=' + encodeURIComponent(t('inviteSmsBody'));
  }

  function noticeMessages(){
    var table = STRINGS[currentLang] || STRINGS.en;
    return table.noticeMessages || STRINGS.en.noticeMessages;
  }

  function startNoticeRotation(){
    var el = document.getElementById('notice-bar');
    var msgs = noticeMessages();
    if(!el || msgs.length < 2) return;
    var idx = 0;
    setInterval(function(){
      idx = (idx + 1) % msgs.length;
      el.style.opacity = '0';
      setTimeout(function(){
        el.innerHTML = msgs[idx];
        el.style.opacity = '1';
      }, 400);
    }, 10000);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function makeId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* Lets staff correct or backdate a "paid at" time — there's no real payment gateway, so this
     is how a late Venmo/Zelle check-in (or fixing a mistaken auto-cancel) gets recorded with the
     time the payment actually happened. Uses a real date/time picker (not window.prompt) so staff
     just pick from the calendar/clock instead of typing a date string. */
  var pendingPaidTimeCallback = null;

  function dateToLocalInputValue(d){
    var pad = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function openPaidTimeModal(defaultDate, title, onConfirm){
    var modal = document.getElementById('paid-time-modal');
    var input = document.getElementById('paid-time-modal-input');
    var errorEl = document.getElementById('paid-time-modal-error');
    var titleEl = document.getElementById('paid-time-modal-title');
    if(!modal || !input) { onConfirm(defaultDate); return; } // fallback safety net
    if(titleEl) titleEl.textContent = title || 'When did they pay?';
    if(errorEl) errorEl.textContent = '';
    input.value = dateToLocalInputValue(defaultDate);
    pendingPaidTimeCallback = onConfirm;
    modal.hidden = false;
    input.focus();
  }

  /* Shows the relevant rules for whatever they're about to confirm (which plan, or booking a
     specific credit date) and only proceeds once they click through. */
  var pendingRulesCallback = null;

  /* Pay-box shows one payment method at a time (Venmo/Zelle/Cash), picked via
     the toggle buttons above the pay lines. Defaults to Venmo whenever the
     pay-box is freshly revealed. */
  function selectPayMethod(method){
    var toggle = document.getElementById('pay-method-toggle');
    if(!toggle) return;
    var btns = toggle.querySelectorAll('.pay-method-btn');
    for(var i = 0; i < btns.length; i++){
      var isMatch = btns[i].getAttribute('data-method') === method;
      btns[i].classList.toggle('is-active', isMatch);
    }
    var lines = document.querySelectorAll('.pay-box .pay-line[data-pay-method]');
    for(var j = 0; j < lines.length; j++){
      lines[j].classList.toggle('is-active', lines[j].getAttribute('data-pay-method') === method);
    }
  }

  /* Which single class date the printable roster is currently filtered to (a value from
     the "Print / Save as PDF" date picker) — "" means the full, unfiltered roster. */
  var rosterFilterVal = '';

  function openRulesModal(rules, onConfirm){
    var modal = document.getElementById('rules-modal');
    var list = document.getElementById('rules-modal-list');
    if(!modal || !list) { onConfirm(); return; } // fallback safety net
    list.innerHTML = rules.map(function(r){ return '<li>' + escapeHtml(r) + '</li>'; }).join('');
    pendingRulesCallback = onConfirm;
    modal.hidden = false;
  }

  /* Plan-specific rules shown before a sign-up is confirmed. The 50%-forfeit money policy
     (policy2) only makes sense for a single paid class — credit plans already have their
     own rule just above (miss it and the CREDIT comes back, no money ever changes hands
     per visit), so it's left off for those to avoid the two contradicting each other. */
  function rulesForPlan(planVal, location){
    var rules = [];
    var isCredit = isCreditPlan(planVal);
    if(isMembershipPlan(planVal)){
      rules.push(tf('rulesMembership1', { n: membershipCreditsFor(location) }));
      rules.push(t('rulesMembership2'));
      rules.push(t('rulesMembership3'));
      rules.push(t('rulesMembership4'));
    } else if(isAnyLocationPackPlan(planVal)){
      rules.push(tf('rulesAnyPack1', { n: ANY_LOCATION_PACK_CLASSES }));
      rules.push(t('rulesMembership2'));
      rules.push(t('rulesMembership3'));
      rules.push(t('rulesMembership4'));
    } else if(isCreditPackPlan(planVal)){
      rules.push(tf('rulesPackCredits1', { n: creditPlanClasses(planVal, location) }));
      rules.push(t('rulesMembership2'));
      rules.push(t('rulesMembership3'));
      rules.push(t('rulesMembership4'));
    } else if(isLegacyTwoClassPackEntry(planVal)){
      rules.push(tf('rulesPack1', { plan: planVal }));
      rules.push(t('rulesPack2'));
    } else {
      rules.push(t('rulesSingle1'));
    }
    rules.push(t('policy1') + t('policy1End'));
    if(!isCredit) rules.push(t('policy2') + t('policy2End'));
    return rules;
  }

  function shellSVG(cls){
    return '<img class="floating-shell ' + cls + '" src="' + GIRL_GRAPHIC_SRC + '" alt="" aria-hidden="true">';
  }

  /* Parses a class string like "San Francisco — Sat Sept 5, 10:30am" into a real Date,
     so we can tell whether a cancellation happened inside the 2-hour window (50% refund)
     or with enough notice (100% refund). Assumes the current year — the schedule already
     gets updated by hand each month, same as the date squares themselves. */
  var MONTH_MAP = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };

  function parseClassDateTime(locationStr){
    if(!locationStr) return null;
    var m = /([A-Za-z]+)\s+(\d{1,2}),\s*(\d{1,2}):(\d{2})\s*(am|pm)/i.exec(locationStr);
    if(!m) return null;
    var monthKey = m[1].slice(0, 3).toLowerCase();
    if(!(monthKey in MONTH_MAP)) return null;
    var month = MONTH_MAP[monthKey];
    var day = parseInt(m[2], 10);
    var hour = parseInt(m[3], 10);
    var minute = parseInt(m[4], 10);
    var ampm = m[5].toLowerCase();
    if(ampm === 'pm' && hour !== 12) hour += 12;
    if(ampm === 'am' && hour === 12) hour = 0;
    var now = new Date();
    var dt = new Date(now.getFullYear(), month, day, hour, minute, 0, 0);
    if((now - dt) / (1000 * 60 * 60 * 24) > 200){
      dt = new Date(now.getFullYear() + 1, month, day, hour, minute, 0, 0);
    }
    return dt;
  }

  function computeRefundPct(locationStr, atDate){
    var classDt = parseClassDateTime(locationStr);
    if(!classDt) return null;
    var hoursUntilClass = (classDt.getTime() - atDate.getTime()) / (1000 * 60 * 60);
    return hoursUntilClass < 2 ? 50 : 100;
  }

  /* Payment deadline is 2 hours before class — if nobody's marked a sign-up paid by then,
     it auto-cancels so the spot isn't held on a promise. This only knows about payment
     because Marcela (or auto-sync) marked it paid — there's no real payment gateway wired
     up, so it's only as accurate as how promptly "Mark paid" gets clicked. */
  function classDeadlinePassed(locationStr, atDate){
    var classDt = parseClassDateTime(locationStr);
    if(!classDt) return false;
    var deadline = new Date(classDt.getTime() - 2 * 60 * 60 * 1000);
    return atDate.getTime() >= deadline.getTime();
  }

  /* Membership credits aren't tied to one specific date, but the studio's schedule is —
     so for the "cancel my membership" refund %, we use the same 2-hour rule against
     whichever class at that location is coming up soonest. */
  function membershipNextClassRefundPct(location, atDate){
    var dates = CLASS_DATES[location] || [];
    var upcoming = dates
      .map(function(d){ return parseClassDateTime(d.value); })
      .filter(function(dt){ return dt && dt.getTime() > atDate.getTime(); })
      .sort(function(a, b){ return a.getTime() - b.getTime(); });
    if(!upcoming.length) return 100;
    var hoursUntilClass = (upcoming[0].getTime() - atDate.getTime()) / (1000 * 60 * 60);
    return hoursUntilClass < 2 ? 50 : 100;
  }

  function autoCancelUnpaidSignups(){
    var now = new Date();
    var changed = false;
    state.signups.forEach(function(s){
      if(s.canceled || s.paid) return;
      if(classDeadlinePassed(s.location, now)){
        s.canceled = true;
        s.canceledAt = now.toLocaleString();
        s.autoCanceled = true;
        s.refundPct = null;
        changed = true;
        sheetsPost({ action: 'update', id: s.id, patch: { canceled: true, canceledAt: s.canceledAt, autoCanceled: true } });
      }
    });
    if(changed){
      patchSignupUI();
      publishState();
    }
    return changed;
  }

  function normalizePhone(p){
    return String(p || '').replace(/\D/g, '');
  }

  /* Pack days get a choice (change date vs. cancel & refund); a Membership with unused credits
     gets a choice too (keep the credits for next month vs. cancel & refund them) since its
     credits aren't tied to one date; everything else (Drop-in, First Class) keeps the original
     single cancel button. */
  function cancelCardActionsHTML(entry){
    if(entry.creditVisit){
      return '<button type="button" class="btn btn-outline btn-small cancel-credit-visit-btn" data-id="' + escapeHtml(entry.id) + '">' + t('cancelEntryBtn') + '</button>';
    }
    if(isCreditPlan(entry.plan)){
      var mBalance = creditBalance(entry.email, creditGroupForEntry(entry));
      var mButtons = '<button type="button" class="btn btn-outline btn-small change-date-btn" data-id="' + escapeHtml(entry.id) + '">' + t('changeDateBtn') + '</button>';
      if(mBalance > 0){
        mButtons += '<button type="button" class="btn btn-outline btn-small pause-membership-btn" data-id="' + escapeHtml(entry.id) + '">' + t('pauseMembershipBtn') + '</button>';
      }
      mButtons += '<button type="button" class="btn btn-outline btn-small cancel-membership-btn" data-id="' + escapeHtml(entry.id) + '">' + t('cancelMembershipBtn') + '</button>';
      return '<div class="cancel-btn-row">' + mButtons + '</div>';
    }
    if(isLegacyTwoClassPackEntry(entry.plan)){
      return '<div class="cancel-btn-row">' +
        '<button type="button" class="btn btn-outline btn-small change-date-btn" data-id="' + escapeHtml(entry.id) + '">' + t('changeDateBtn') + '</button>' +
        '<button type="button" class="btn btn-outline btn-small cancel-entry-btn" data-id="' + escapeHtml(entry.id) + '">' + t('cancelEntryBtn') + '</button>' +
      '</div>';
    }
    return '<button type="button" class="btn btn-outline btn-small cancel-entry-btn" data-id="' + escapeHtml(entry.id) + '">' + t('cancelEntryBtn') + '</button>';
  }

  function cancelResultsHTML(matches){
    if(!matches || matches.length === 0){
      return '<p class="cancel-empty">' + t('cancelEmptyResult') + '</p>';
    }
    return matches.map(function(s){
      return '<div class="cancel-result-card" data-id="' + escapeHtml(s.id) + '">' +
        '<div class="cancel-result-info">' +
          '<p class="cancel-result-name">' + escapeHtml(s.name) + '</p>' +
          '<p class="cancel-result-meta">' + escapeHtml(s.location || '') + (s.plan ? ' · ' + escapeHtml(s.plan) : '') + '</p>' +
        '</div>' +
        '<div class="cancel-result-actions">' + cancelCardActionsHTML(s) + '</div>' +
      '</div>';
    }).join('');
  }

  /* Shared by both the sign-ups list and the class-requests list, so both group
     the same way and stay in the same San Francisco / Richmond / Santa Clara order. */
  var KNOWN_LOCATIONS = ['San Francisco', 'Richmond', 'Santa Clara'];

  function signupLocationGroup(loc){
    loc = loc || '';
    for(var i=0;i<KNOWN_LOCATIONS.length;i++){
      if(loc.indexOf(KNOWN_LOCATIONS[i]) === 0) return KNOWN_LOCATIONS[i];
    }
    return 'Other';
  }

  /* ---- Monthly Membership class credits: good for the paid month only (no
     rollover, no refund for unused ones — staff clears stale balances by hand),
     and are tracked per (student, location) so an SF membership can't be used in
     Santa Clara or vice versa. Most locations grant 4 classes per payment; Richmond
     grants 5 (its membership is priced for 5 classes/month). ---- */
  var CREDITS_PER_MEMBERSHIP_PAYMENT = 4;
  var MEMBERSHIP_CREDITS_BY_LOCATION = { 'Richmond': 5 };
  function membershipCreditsFor(locationGroup){
    return MEMBERSHIP_CREDITS_BY_LOCATION[locationGroup] || CREDITS_PER_MEMBERSHIP_PAYMENT;
  }

  /* ---- Any-Location 6-Class Pack: a $150 pack of ANY_LOCATION_PACK_CLASSES credits that
     work at any of our 3 locations, tracked in its own pooled "Any Location" bucket instead
     of a single-location one (see creditGroupForEntry below). ---- */
  var ANY_LOCATION_GROUP = 'Any Location';
  var ANY_LOCATION_PACK_CLASSES = 6;
  var ANY_LOCATION_PACK_PRICE = 150;

  function normalizeEmail(e){
    return String(e || '').trim().toLowerCase();
  }

  function isMembershipPlan(planVal){
    return (planVal || '').indexOf('Monthly Membership') === 0;
  }

  function isAnyLocationPackPlan(planVal){
    return (planVal || '').indexOf('Any-Location 6-Class Pack') === 0;
  }

  /* True for a current-format "N-Class Pack ($P)" purchase — every pack sold today,
     at every location, works as a credit plan (buy now, book exact dates later from
     the Check Your Credits page) just like a membership. Does NOT match old stored
     entries that carry the legacy " — class 1 of 2" / " — class 2 of 2" suffix (see
     isLegacyTwoClassPackEntry below), since those already picked both dates at signup. */
  function isCreditPackPlan(planVal){
    return /^\d+-Class Pack \(\$[0-9.]+\)$/.test(planVal || '');
  }

  /* True for OLD-style 2-Class Pack entries already saved (before packs became credit
     plans) with the "— class 1 of 2" / "— class 2 of 2" suffix. Kept only so already-
     existing Sheet rows keep working correctly in the Cancel/Change flow. */
  function isLegacyTwoClassPackEntry(planVal){
    return /^2-Class Pack \(\$[0-9.]+\) — class [12] of 2$/.test(planVal || '');
  }

  /* True for any plan that grants class credits (used instead of one-off signup entries). */
  function isCreditPlan(planVal){
    return isMembershipPlan(planVal) || isAnyLocationPackPlan(planVal) || isCreditPackPlan(planVal);
  }

  /* Which credit bucket a signup (or a credit-visit booked from one) belongs to — the
     student's specific location for a Membership, or the pooled "Any Location" bucket
     for the Any-Location Pack (identified by its plan text, since a pack visit's own
     .location is always a real dated class, not a bucket name). */
  function creditGroupForEntry(entry){
    return isAnyLocationPackPlan(entry.plan) ? ANY_LOCATION_GROUP : signupLocationGroup(entry.location);
  }

  /* How many class credits a given credit plan is worth. Handles the Any-Location Pack,
     legacy Monthly Membership entries (if any remain in the Sheet), and every current
     "N-Class Pack ($P)" tier by reading N straight out of its plan text. */
  function creditPlanClasses(planVal, locationGroup){
    if(isAnyLocationPackPlan(planVal)) return ANY_LOCATION_PACK_CLASSES;
    if(isMembershipPlan(planVal)) return membershipCreditsFor(locationGroup);
    var m = /^(\d+)-Class Pack/.exec(planVal || '');
    return m ? parseInt(m[1], 10) : 0;
  }

  function creditBalance(email, location){
    var key = normalizeEmail(email);
    return state.credits
      .filter(function(c){ return normalizeEmail(c.email) === key && c.location === location; })
      .reduce(function(sum, c){ return sum + (Number(c.delta) || 0); }, 0);
  }

  function membershipCreditNet(sourceSignupId){
    return state.credits
      .filter(function(c){ return c.sourceSignupId === sourceSignupId; })
      .reduce(function(sum, c){ return sum + (Number(c.delta) || 0); }, 0);
  }

  /* When a Monthly Membership or Any-Location Pack sign-up is marked paid, grant that
     plan's class credits (idempotent — clicking "Mark paid" twice in a row without
     unmarking won't double-grant). */
  function grantMembershipCredit(entry){
    if(!isCreditPlan(entry.plan)) return;
    if(membershipCreditNet(entry.id) > 0) return;
    var group = creditGroupForEntry(entry);
    var creditEntry = {
      id: makeId(), email: entry.email, name: entry.name, phone: entry.phone,
      location: group, delta: creditPlanClasses(entry.plan, group),
      reason: isAnyLocationPackPlan(entry.plan) ? 'Any-Location Pack payment' : 'Membership payment',
      sourceSignupId: entry.id, date: new Date().toLocaleString()
    };
    state.credits.push(creditEntry);
    sheetsPost({ action: 'credit', entry: creditEntry });
  }

  /* Mirror of the above for when staff un-marks a Monthly Membership/Any-Location Pack as paid by mistake. */
  function reverseMembershipCredit(entry){
    if(!isCreditPlan(entry.plan)) return;
    if(membershipCreditNet(entry.id) <= 0) return;
    var group = creditGroupForEntry(entry);
    var creditEntry = {
      id: makeId(), email: entry.email, name: entry.name, phone: entry.phone,
      location: group, delta: -creditPlanClasses(entry.plan, group),
      reason: isAnyLocationPackPlan(entry.plan) ? 'Any-Location Pack payment reversed' : 'Membership payment reversed',
      sourceSignupId: entry.id, date: new Date().toLocaleString()
    };
    state.credits.push(creditEntry);
    sheetsPost({ action: 'credit', entry: creditEntry });
  }

  /* A "credit visit" is one specific class date booked using a pack/membership credit (see
     book-credit-date-btn). That credit was already paid for as part of the pack, so missing
     or canceling any specific date — early or last-minute — always gives it back to the
     balance to rebook. The only real deadline is the calendar month itself: credits left
     unused when the month ends are forfeited with no refund (see the credit-expiration
     policy) — there's no separate 2-hour penalty for a single missed date like there is
     for a plain drop-in/First Class sign-up. */
  function cancelCreditVisitEntry(entry){
    var now = new Date();
    entry.canceled = true;
    entry.canceledAt = now.toLocaleString();
    sheetsPost({ action: 'update', id: entry.id, patch: { canceled: true, canceledAt: entry.canceledAt } });
    var loc = creditGroupForEntry(entry);
    var creditEntry = {
      id: makeId(), email: entry.email, name: entry.name, phone: entry.phone,
      location: loc, delta: 1, reason: 'Booked class canceled: ' + entry.location,
      sourceSignupId: entry.id, date: now.toLocaleString()
    };
    state.credits.push(creditEntry);
    sheetsPost({ action: 'credit', entry: creditEntry });
  }

  /* One row per unique (email, location) pair that has ever had a credit transaction —
     used by both the Staff Portal's Membership Credits panel and the public credit lookup. */
  function memberCreditRows(){
    var seen = {};
    var rows = [];
    state.credits.forEach(function(c){
      var key = normalizeEmail(c.email) + '|' + c.location;
      if(seen[key]) return;
      seen[key] = true;
      rows.push({ email: c.email, name: c.name, phone: c.phone, location: c.location, balance: creditBalance(c.email, c.location) });
    });
    return rows;
  }

  function memberCreditRowsFor(query){
    var raw = String(query || '').trim().toLowerCase();
    var rawDigits = normalizePhone(raw);
    return memberCreditRows().filter(function(m){
      var emailMatch = m.email && m.email.toLowerCase() === raw;
      var phoneMatch = rawDigits.length >= 7 && m.phone && normalizePhone(m.phone) === rawDigits;
      return emailMatch || phoneMatch;
    });
  }

  /* Fallback renew amount when we can't find any past purchase to go on — 6 for the pooled
     Any-Location Pack bucket, otherwise whatever this location's legacy membership granted. */
  function renewAmountFor(locationGroup){
    return locationGroup === ANY_LOCATION_GROUP ? ANY_LOCATION_PACK_CLASSES : membershipCreditsFor(locationGroup);
  }

  /* A location can now sell several different pack sizes (e.g. Richmond's 2/3/5-class
     packs), so "+ Renew" can't assume one fixed amount per location anymore — it looks up
     the member's most recent credit-plan purchase in this bucket and renews that same size. */
  function lastCreditPlanClassesFor(email, locationGroup){
    var key = normalizeEmail(email);
    var matches = state.signups.filter(function(s){
      return normalizeEmail(s.email) === key && isCreditPlan(s.plan) && creditGroupForEntry(s) === locationGroup;
    });
    if(!matches.length) return renewAmountFor(locationGroup);
    return creditPlanClasses(matches[matches.length - 1].plan, locationGroup) || renewAmountFor(locationGroup);
  }

  function creditItemHTML(m){
    var balance = m.balance;
    var balClass = balance <= 0 ? ' zero' : (balance <= 1 ? ' low' : '');
    return '<li class="credit-item">' +
      '<div class="who"><strong>' + escapeHtml(m.name) + '</strong>' +
        '<span class="credit-balance' + balClass + '">' + balance + (balance === 1 ? ' class left' : ' classes left') + '</span>' +
      '</div>' +
      '<div class="signup-meta">' + escapeHtml(m.location) + ' · ' + escapeHtml(m.email) + (m.phone ? ' · ' + escapeHtml(m.phone) : '') + '</div>' +
      '<div class="credit-actions">' +
        '<button type="button" class="credit-btn credit-log-btn" data-email="' + escapeHtml(m.email) + '" data-location="' + escapeHtml(m.location) + '"' +
          (balance <= 0 ? ' disabled title="No classes left to log"' : '') + '>− Log class attended</button>' +
        '<button type="button" class="credit-btn credit-add-btn" data-email="' + escapeHtml(m.email) + '" data-location="' + escapeHtml(m.location) + '" title="Fix a mistake by 1 class">+ Add credit</button>' +
        '<button type="button" class="credit-btn credit-renew-btn" data-email="' + escapeHtml(m.email) + '" data-name="' + escapeHtml(m.name) + '" data-phone="' + escapeHtml(m.phone) + '" data-location="' + escapeHtml(m.location) + '" title="They paid for another month">+ Renew (' + lastCreditPlanClassesFor(m.email, m.location) + ' classes)</button>' +
        '<button type="button" class="credit-btn credit-remove-btn" data-email="' + escapeHtml(m.email) + '" data-name="' + escapeHtml(m.name) + '" data-location="' + escapeHtml(m.location) + '" title="Permanently remove them from this list">🗑 Remove</button>' +
      '</div>' +
    '</li>';
  }

  function creditsListHTML(){
    var rows = memberCreditRows();
    if(!rows.length) return '<p class="empty-note">No memberships yet.</p>';
    var groups = {};
    var order = KNOWN_LOCATIONS.concat([ANY_LOCATION_GROUP, 'Other']);
    order.forEach(function(g){ groups[g] = []; });
    rows.forEach(function(m){
      if(!groups[m.location]) groups[m.location] = [];
      groups[m.location].push(m);
    });
    var out = '';
    order.forEach(function(g){
      var list = groups[g];
      if(!list || !list.length) return;
      out += '<div class="credit-group">' +
        '<div class="credit-group-heading">' + escapeHtml(g) + ' (' + list.length + ')</div>' +
        '<ul class="credit-list">' + list.map(creditItemHTML).join('') + '</ul>' +
      '</div>';
    });
    return '<div class="credit-groups">' + out + '</div>';
  }

  /* Class dates this member has already booked with a credit in this bucket (not canceled). */
  function creditVisitsFor(email, location){
    var key = normalizeEmail(email);
    return state.signups.filter(function(s){
      return s.creditVisit && !s.canceled && normalizeEmail(s.email) === key && creditGroupForEntry(s) === location;
    });
  }

  /* One row per upcoming class date at this member's location — "Book" if they still have
     credit and haven't already booked it, or "Booked" with a cancel option if they have. */
  function creditDateRowsHTML(m){
    var now = new Date();
    var dates = (CLASS_DATES[m.location] || []).filter(function(d){
      var dt = parseClassDateTime(d.value);
      return !dt || dt.getTime() > now.getTime();
    });
    if(!dates.length) return '';
    var visits = creditVisitsFor(m.email, m.location);
    var rows = dates.map(function(d){
      var visit = visits.filter(function(v){ return v.location === d.value; })[0];
      if(visit){
        return '<div class="credit-date-row credit-date-booked">' +
          '<span>' + escapeHtml(d.label) + ' — ' + t('creditDateBookedLabel') + '</span>' +
          '<button type="button" class="btn btn-outline btn-small cancel-credit-visit-btn" data-id="' + escapeHtml(visit.id) + '">' + t('cancelEntryBtn') + '</button>' +
        '</div>';
      }
      var disabledAttr = m.balance <= 0 ? ' disabled' : '';
      return '<div class="credit-date-row">' +
        '<span>' + escapeHtml(d.label) + '</span>' +
        '<button type="button" class="btn btn-outline btn-small book-credit-date-btn"' + disabledAttr +
          ' data-email="' + escapeHtml(m.email) + '" data-name="' + escapeHtml(m.name) + '" data-phone="' + escapeHtml(m.phone) + '"' +
          ' data-location="' + escapeHtml(m.location) + '" data-date="' + escapeHtml(d.value) + '">' + t('bookDateBtn') + '</button>' +
      '</div>';
    }).join('');
    var forfeitNote = m.balance > 0
      ? '<p class="save-next-month-note">' + tf('creditsForfeitWarning', { n: m.balance }) + '</p>'
      : '';
    return '<div class="credit-date-picker"><p class="credit-date-picker-label">' + t('pickYourDatesLabel') + '</p>' + rows + forfeitNote + '</div>';
  }

  function creditLookupResultsHTML(rows){
    if(!rows || rows.length === 0){
      return '<p class="cancel-empty">' + t('creditsNoMembership') + '</p>';
    }
    var cards = rows.map(function(m){
      var balClass = m.balance <= 0 ? ' zero' : (m.balance <= 1 ? ' low' : '');
      return '<div class="credit-result-card">' +
        '<div class="credit-result-top">' +
          '<div class="credit-result-info">' +
            '<p class="cancel-result-name">' + escapeHtml(m.location) + '</p>' +
            '<p class="cancel-result-meta">' + tf('creditsBalanceLine', {n: m.balance}) + '</p>' +
          '</div>' +
          '<span class="credit-balance' + balClass + '">' + m.balance + '</span>' +
        '</div>' +
        creditDateRowsHTML(m) +
      '</div>';
    }).join('');
    return cards + '<div class="credits-cta"><a class="btn btn-outline btn-small" href="#contact">' + t('buyMoreClassesBtn') + '</a></div>';
  }

  function signupItemHTML(s){
    var paid = !!s.paid;
    var canceled = !!s.canceled;
    var refundAmountText = (s.refundAmount != null && s.refundAmount > 0) ? ' ($' + Number(s.refundAmount).toFixed(2) + ')' : '';
    var refundClass = s.autoCanceled ? ' auto-canceled' : (s.refundPct === 50 ? ' refund-partial' : (s.refundPct === 100 ? ' refund-full' : ''));
    var canceledLabel = s.autoCanceled
      ? 'Auto-canceled · unpaid by deadline'
      : (s.refundPct != null ? 'Canceled · ' + s.refundPct + '% refund' + refundAmountText : 'Canceled');
    var statusBadge = canceled
      ? '<span class="paid-badge canceled' + refundClass + '">' + canceledLabel + '</span>'
      : '<span class="paid-badge ' + (paid ? 'paid' : 'unpaid') + '">' + (paid ? 'Paid' : 'Unpaid') + '</span>';
    var actionsHTML = '';
    if(canceled){
      actionsHTML = (s.autoCanceled ? '<button type="button" class="reactivate-btn" data-id="' + escapeHtml(s.id) + '">Reactivate &amp; mark paid</button>' : '') +
        '<button type="button" class="remove-signup-btn" data-id="' + escapeHtml(s.id) + '" title="Permanently delete this entry">🗑 Remove</button>';
    } else if(!canceled){
      actionsHTML = '<button type="button" class="mark-paid-btn" data-id="' + escapeHtml(s.id) + '">' + (paid ? 'Mark unpaid' : 'Mark paid') + '</button>' +
        (paid ? '<button type="button" class="edit-paid-time-btn" data-id="' + escapeHtml(s.id) + '" title="Fix the exact time they paid">Edit paid time</button>' : '');
    }
    return '<li class="signup-item' + (canceled ? ' is-canceled' : '') + '">' +
      '<div class="signup-top">' +
        '<div class="who"><strong>' + escapeHtml(s.name) + '</strong>' + statusBadge + '</div>' +
        '<div class="signup-actions">' + actionsHTML + '</div>' +
      '</div>' +
      '<div class="signup-meta">' + escapeHtml(s.location) + (s.plan ? ' · ' + escapeHtml(s.plan) : '') + ' · ' + escapeHtml(s.email) +
      (s.phone ? ' · ' + escapeHtml(s.phone) : '') + ' · <span class="signup-date">signed up ' + escapeHtml(s.date || '') + '</span>' +
      (s.paid && s.paidAt ? ' · <span class="paid-at">paid ' + escapeHtml(s.paidAt) + '</span>' : '') +
      (canceled && s.canceledAt ? ' · <span class="canceled-at">canceled ' + escapeHtml(s.canceledAt) + '</span>' : '') + '</div>' +
      (s.message ? '<div class="signup-msg">“' + escapeHtml(s.message) + '”</div>' : '') +
      (canceled && s.autoCanceled
        ? '<div class="auto-cancel-note">Auto-canceled because no payment was marked in this app within 2 hours of class time. This site can\'t see your Venmo or bank — please check there first. If they did pay, use “Reactivate &amp; mark paid” below.</div>'
        : '') +
      '</li>';
  }

  function signupsListHTML(signups){
    if(!signups || signups.length === 0){
      return '<p class="empty-note">No sign-ups yet.</p>';
    }
    var groups = {};
    var order = KNOWN_LOCATIONS.concat(['Other']);
    order.forEach(function(g){ groups[g] = []; });
    signups.slice().reverse().forEach(function(s){
      groups[signupLocationGroup(s.location)].push(s);
    });
    var out = '';
    order.forEach(function(g){
      var list = groups[g];
      if(!list.length) return;
      out += '<div class="location-group">' +
        '<div class="location-group-heading">' + escapeHtml(g) + ' (' + list.length + ')</div>' +
        '<ul class="signup-list">' + list.map(signupItemHTML).join('') + '</ul>' +
      '</div>';
    });
    return '<div class="signup-groups">' + out + '</div>';
  }

  /* ---- class requests (area requests + private-class requests) ---- */

  function requestAreaGroupKey(area){
    var raw = (area || '').trim();
    var norm = raw.toLowerCase().replace(/[^a-z]/g, '');
    if(!raw) return { key: 'unspecified', label: 'Unspecified area' };
    if(norm.indexOf('sanfrancisco') !== -1 || norm === 'sf') return { key: 'San Francisco', label: 'San Francisco' };
    if(norm.indexOf('richmond') !== -1) return { key: 'Richmond', label: 'Richmond' };
    if(norm.indexOf('santaclara') !== -1 || norm === 'sc') return { key: 'Santa Clara', label: 'Santa Clara' };
    return { key: 'other:' + norm, label: raw };
  }

  function requestsListHTML(requests){
    if(!requests || requests.length === 0){
      return '<p class="empty-note">No class requests yet.</p>';
    }
    var privateReqs = requests.filter(function(r){ return r.private; }).slice().reverse();
    var areaReqs = requests.filter(function(r){ return !r.private; }).slice().reverse();
    var out = '';

    if(privateReqs.length){
      out += '<div class="request-group">' +
        '<div class="request-group-heading">Private class requests (' + privateReqs.length + ')</div>' +
        '<ul class="request-list">' + privateReqs.map(requestItemHTML).join('') + '</ul>' +
      '</div>';
    }

    if(areaReqs.length){
      var groups = {};
      areaReqs.forEach(function(r){
        var g = requestAreaGroupKey(r.area);
        if(!groups[g.key]) groups[g.key] = { label: g.label, items: [] };
        groups[g.key].items.push(r);
      });
      var priority = { 'San Francisco': 0, 'Richmond': 1, 'Santa Clara': 2 };
      var orderedKeys = Object.keys(groups).sort(function(a,b){
        var pa = priority.hasOwnProperty(a) ? priority[a] : (a === 'unspecified' ? 99 : 50);
        var pb = priority.hasOwnProperty(b) ? priority[b] : (b === 'unspecified' ? 99 : 50);
        if(pa !== pb) return pa - pb;
        return groups[a].label.localeCompare(groups[b].label);
      });
      orderedKeys.forEach(function(key){
        var g = groups[key];
        out += '<div class="request-group">' +
          '<div class="request-group-heading">' + escapeHtml(g.label) + ' (' + g.items.length + ')</div>' +
          '<ul class="request-list">' + g.items.map(requestItemHTML).join('') + '</ul>' +
        '</div>';
      });
    }

    return '<div class="request-groups">' + out + '</div>';
  }

     their own signup entries whose .location IS the specific dated class — see

  function filteredSignupsForRoster(){

  function staffSummary(signups){
    var total = signups.length;
    var canceledList = signups.filter(function(s){ return s.canceled; });
    var canceled = canceledList.length;
    var partialRefunds = canceledList.filter(function(s){ return s.refundPct === 50; }).length;
    var autoCanceled = canceledList.filter(function(s){ return s.autoCanceled; }).length;
    var active = signups.filter(function(s){ return !s.canceled; });
    var paid = active.filter(function(s){ return s.paid; }).length;
    var extras = [];
    if(partialRefunds) extras.push(partialRefunds + ' owe only 50% refund');
    if(autoCanceled) extras.push(autoCanceled + ' auto-canceled (unpaid)');
    return total + ' signed up · ' + paid + ' paid · ' + (active.length - paid) + ' awaiting payment · ' +
      canceled + ' canceled' + (extras.length ? ' (' + extras.join(' · ') + ')' : '');
  }

     (e.g. Richmond's 2/3/5-class packs) instead of one fixed pack + one membership. Every
     pack works as a credit plan: buy now, pick exact class dates later on the Check Your
     Credits page. */
  var LOCATION_PLANS = {
    'San Francisco': { first: 20, dropin: 25, packs: [ {classes: 2, price: 46}, {classes: 3, price: 68} ] },
    'Richmond':       { first: 25, dropin: 32, packs: [ {classes: 2, price: 58}, {classes: 3, price: 82}, {classes: 5, price: 130} ] },
    'Santa Clara':    { first: 25, dropin: 30, packs: [ {classes: 2, price: 54}, {classes: 4, price: 100} ] }
  };

  /* Renders the price cards for one location's pricing-tab block: First Class, Drop-in,
     then one card per pack tier — the per-class price and % off drop-in are computed from
     the data instead of hand-typed, so adding/changing a tier never needs new fine print. */
  function pricingBlockHTML(loc){
    var p = LOCATION_PLANS[loc];
    if(!p) return '';
    var cards =
      '<div class="price-card"><div class="plan-name">' + t('planFirst') + '</div><div class="amount">$' + p.first + '</div><p class="fine">' + t('fineNewStudents') + '</p><a class="btn btn-outline btn-small" href="#contact">' + t('ctaTryClass') + '</a></div>' +
      '<div class="price-card"><div class="plan-name">' + t('planDropin') + '</div><div class="amount">$' + p.dropin + '</div><p class="fine">' + t('fineDropin') + '</p><a class="btn btn-outline btn-small" href="#contact">' + t('ctaReserve') + '</a></div>';
    cards += p.packs.map(function(pk){
      var perClass = pk.price / pk.classes;
      var pct = Math.round((1 - (perClass / p.dropin)) * 100);
      return '<div class="price-card"><div class="plan-name">' + tf('planPackLabel', {n: pk.classes}) + '</div><div class="amount">$' + pk.price + '</div><p class="fine">' + tf('pricePerClassFine', {p: perClass.toFixed(2), pct: pct}) + '</p><a class="btn btn-outline btn-small" href="#contact">' + t('ctaGetPack') + '</a></div>';
    }).join('');
    return '<div class="price-row">' + cards + '</div>';
  }

    var p = LOCATION_PLANS[loc];
    if(!p){
      return '<option value="">' + t('selectClassFirst') + '</option>';

      return '<option value="' + pk.classes + '-Class Pack ($' + pk.price + ')">' + tf('planPackOpt', {n: pk.classes, p: pk.price}) + '</option>';
    }).join('');
    return '' +
      '<option value="" selected disabled>' + t('selectAPlan') + '</option>' +
      '<option value="First Class ($' + p.first + ')">' + tf('planFirstOpt', {p: p.first}) + '</option>' +
      '<option value="Drop-in ($' + p.dropin + ')">' + tf('planDropinOpt', {p: p.dropin}) + '</option>' +
      packOpts +
      '<option value="Any-Location 6-Class Pack ($' + ANY_LOCATION_PACK_PRICE + ')">' + tf('planAnyPackOpt', {p: ANY_LOCATION_PACK_PRICE}) + '</option>';
  }

  /* Pooled view of every upcoming class across all 3 locations, used by the Any-Location
     6-Class Pack so those members can book any date at any location from one list. */
  CLASS_DATES[ANY_LOCATION_GROUP] = KNOWN_LOCATIONS.reduce(function(acc, loc){
    return acc.concat((CLASS_DATES[loc] || []).map(function(d){
      return { value: d.value, label: loc + ' – ' + d.label };
    }));
  }, []).sort(function(a, b){
    var da = parseClassDateTime(a.value), db = parseClassDateTime(b.value);

  /* Membership doesn't pick a specific class date at sign-up anymore — just a location.
     Specific dates get picked later from the Credits page, one class credit at a time.
     So while Membership is the selected plan, the dated sub-options in #f-location are
     disabled (forcing the bare location value); switching to any other plan re-enables them. */
  function updateLocationLockForPlan(){
    var planSelect = document.getElementById('f-plan');
    var locSelect = document.getElementById('f-location');
    if(!planSelect || !locSelect) return;
    var membership = isCreditPlan(planSelect.value);
    Array.prototype.forEach.call(locSelect.options, function(opt){
      if(opt.value && opt.value.indexOf(' — ') !== -1){
        opt.disabled = membership;
      }
    });
    if(membership){
      var selected = locSelect.options[locSelect.selectedIndex];
      if(selected && selected.value && selected.value.indexOf(' — ') !== -1){
        locSelect.value = selected.getAttribute('data-loc') || '';
      }
    }
  }

  function wireEvents(){

    var paidTimeModal = document.getElementById('paid-time-modal');

      var paidTimeError = document.getElementById('paid-time-modal-error');
      var closePaidTimeModal = function(){
        paidTimeModal.hidden = true;
        pendingPaidTimeCallback = null;
        if(paidTimeError) paidTimeError.textContent = '';
      };
      var saveBtn = document.getElementById('paid-time-modal-save');
      if(saveBtn){
        saveBtn.addEventListener('click', function(){
          var val = paidTimeInput ? paidTimeInput.value : '';
          var parsed = val ? new Date(val) : null;
          if(!parsed || isNaN(parsed.getTime())){
            if(paidTimeError) paidTimeError.textContent = 'Pick a valid date and time.';

          var cb = pendingPaidTimeCallback;
          closePaidTimeModal();
          if(cb) cb(parsed);

          if(!mEntry) return;
          var mLocation = creditGroupForEntry(mEntry);
          var balance = creditBalance(mEntry.email, mLocation);
          var perPayment = creditPlanClasses(mEntry.plan, mLocation);
          var price = parseFloat(amountFromPlan(mEntry.plan)) || 0;
          var mNow = new Date();
          var pct = balance > 0 ? membershipNextClassRefundPct(mLocation, mNow) : 100;
          var amount = balance > 0 ? Math.round((balance / perPayment) * price * pct) / 100 : 0;
          var confirmMsg = balance > 0
            ? tf('cancelMembershipConfirm', {n: balance, amount: amount.toFixed(2), pct: pct})
            : t('cancelMembershipConfirmNoCredit');
          if(!window.confirm(confirmMsg)) return;

          mEntry.canceled = true;
          mEntry.canceledAt = mNow.toLocaleString();

          if(mCard) mCard.remove();
          if(msgEl) msgEl.textContent = balance > 0 ? tf('cancelMembershipDone', {amount: amount.toFixed(2)}) : t('cancelMembershipDoneNoCredit');

        publishState();
        var card = btn.closest('.cancel-result-card');

        if(!cancelResultsEl.querySelector('.cancel-result-card')){

        if(!rEntry) return;

        openPaidTimeModal(new Date(), 'When did ' + rEntry.name + ' actually pay?', function(rChosen){

            paid: true, paidAt: rEntry.paidAt
          }});
          grantMembershipCredit(rEntry);

          publishState();
        });

      }

      var removeBtn = e.target.closest('.remove-signup-btn');
      if(removeBtn){
        var removeEntry = state.signups.find(function(s){ return s.id === removeBtn.getAttribute('data-id'); });
        if(!removeEntry) return;
        if(!window.confirm('Permanently remove ' + removeEntry.name + '\'s canceled sign-up from this list? This can\'t be undone.')) return;
        var removeIdx = state.signups.indexOf(removeEntry);

      var finishMarkPaid = function(){
        sheetsPost({ action: 'update', id: entry.id, patch: { paid: entry.paid, paidAt: entry.paidAt } });

          grantMembershipCredit(entry);
        } else {
          reverseMembershipCredit(entry);

        if(entry.packId){
          state.signups.forEach(function(sib){
            if(sib.packId === entry.packId && sib.id !== entry.id && !sib.canceled){
              sib.paid = entry.paid;

        entry.paidAt = null;
        finishMarkPaid();
      } else {
        openPaidTimeModal(new Date(), 'When did ' + entry.name + ' pay?', function(chosen){
          entry.paid = true;
          entry.paidAt = chosen.toLocaleString();
          finishMarkPaid();
        });
      }
    });

    var requestsContainer = document.getElementById('requests-container');
    if(requestsContainer){
      requestsContainer.addEventListener('click', function(e){
        var removeReqBtn = e.target.closest('.remove-request-btn');
        if(!removeReqBtn) return;
        var reqEntry = state.classRequests.find(function(r){ return r.id === removeReqBtn.getAttribute('data-id'); });
        if(!reqEntry) return;
        if(!window.confirm('Permanently remove ' + (reqEntry.name || 'this') + '\'s class request? This can\'t be undone.')) return;
        var reqIdx = state.classRequests.indexOf(reqEntry);
        if(reqIdx !== -1) state.classRequests.splice(reqIdx, 1);
        sheetsPost({ action: 'deleteRequest', id: reqEntry.id });
        patchSignupUI();
        publishState();
      });
    }

    var creditsContainer = document.getElementById('credits-container');
    if(creditsContainer){
      creditsContainer.addEventListener('click', function(e){
        var logBtn = e.target.closest('.credit-log-btn');
        var addBtn = e.target.closest('.credit-add-btn');
        var renewBtn = e.target.closest('.credit-renew-btn');
        var removeBtn = e.target.closest('.credit-remove-btn');
        var btn = logBtn || addBtn || renewBtn || removeBtn;
        if(!btn) return;
        var email = btn.getAttribute('data-email');
        var location = btn.getAttribute('data-location');
        if(removeBtn){
          var removeName = removeBtn.getAttribute('data-name') || '';
          if(!window.confirm('Permanently remove ' + removeName + ' from the membership credits list? This can\'t be undone.')) return;
          var normEmail = normalizeEmail(email);
          state.credits = state.credits.filter(function(c){
            return !(normalizeEmail(c.email) === normEmail && c.location === location);
          });
          sheetsPost({ action: 'deleteCredits', email: email, location: location });
          patchSignupUI();
          publishState();
          return;
        }
        var member = memberCreditRows().filter(function(m){
          return normalizeEmail(m.email) === normalizeEmail(email) && m.location === location;
        })[0];
        if(!member) return;
        // Never let a mis-click push someone below zero classes left.
        if(logBtn && creditBalance(member.email, location) <= 0) return;
        var creditEntry = {
          id: makeId(), email: member.email, name: member.name, phone: member.phone,
          location: location, delta: renewBtn ? lastCreditPlanClassesFor(email, location) : (logBtn ? -1 : 1),
          reason: renewBtn ? 'Renewed' : (logBtn ? 'Class attended' : 'Manual adjustment'),
          sourceSignupId: null, date: new Date().toLocaleString()
        };
        state.credits.push(creditEntry);
        sheetsPost({ action: 'credit', entry: creditEntry });
        patchSignupUI();
        publishState();
      });
    }

    var creditsLookupForm = document.getElementById('credits-lookup-form');
    var creditsResultsEl = document.getElementById('credits-lookup-results');
    var lastCreditsQuery = '';
    function refreshCreditsResults(){
      if(creditsResultsEl) creditsResultsEl.innerHTML = creditLookupResultsHTML(memberCreditRowsFor(lastCreditsQuery));
    }
    if(creditsLookupForm){
      creditsLookupForm.addEventListener('submit', function(e){
        e.preventDefault();
        var raw = document.getElementById('credits-lookup').value.trim();
        var msgEl = document.getElementById('credits-lookup-msg');
        if(!raw) return;
        lastCreditsQuery = raw;
        function doSearch(){
          refreshCreditsResults();
          msgEl.textContent = '';
        }
        if(sheetsConfigured()){
          msgEl.textContent = t('looking');
          sheetsFetchAll(function(rows, requestRows, creditRows){
            if(rows) state.signups = rows.map(normalizeSheetRow);
            if(requestRows) state.classRequests = requestRows.map(normalizeRequestRow);
            if(creditRows) state.credits = creditRows.map(normalizeCreditRow);
            if(rows || requestRows || creditRows) patchSignupUI();
            doSearch();
          });
        } else {
          doSearch();
        }
      });
    }

    if(creditsResultsEl){
      creditsResultsEl.addEventListener('click', function(e){
        var bookBtn = e.target.closest('.book-credit-date-btn');
        if(bookBtn){
          if(bookBtn.disabled) return;
          var email = bookBtn.getAttribute('data-email');
          var name = bookBtn.getAttribute('data-name');
          var phone = bookBtn.getAttribute('data-phone');
          var location = bookBtn.getAttribute('data-location');
          var dateVal = bookBtn.getAttribute('data-date');
          if(creditBalance(email, location) <= 0) return;
          var bookRules = [
            tf('rulesBookDate1', { date: dateVal }),
            t('rulesBookDate2'),
            t('rulesBookDate3')
          ];
          openRulesModal(bookRules, function(){
            var visitEntry = {
              id: makeId(), name: name, email: email, phone: phone,
              location: dateVal,
              plan: (location === ANY_LOCATION_GROUP ? 'Any-Location 6-Class Pack' : 'Monthly Membership') + ' — credit visit',
              message: '', date: new Date().toLocaleDateString(),
              paid: true, paidAt: new Date().toLocaleString(), packId: null, creditVisit: true
            };
            state.signups.push(visitEntry);
            sheetsPost({ action: 'signup', entry: visitEntry });
            var bookCreditEntry = {
              id: makeId(), email: email, name: name, phone: phone,
              location: location, delta: -1, reason: 'Booked class: ' + dateVal,
              sourceSignupId: visitEntry.id, date: new Date().toLocaleString()
            };
            state.credits.push(bookCreditEntry);
            sheetsPost({ action: 'credit', entry: bookCreditEntry });
            patchSignupUI();
            publishState();
            refreshCreditsResults();
          });
          return;
        }

        var cancelVisitBtn = e.target.closest('.cancel-credit-visit-btn');
        if(cancelVisitBtn){
          var vEntry = state.signups.find(function(s){ return s.id === cancelVisitBtn.getAttribute('data-id'); });
          if(!vEntry) return;
          if(!window.confirm(t('cancelCreditVisitConfirm'))) return;
          cancelCreditVisitEntry(vEntry);
          patchSignupUI();
          publishState();
          refreshCreditsResults();
          var msgEl2 = document.getElementById('credits-lookup-msg');
          if(msgEl2) msgEl2.textContent = t('cancelCreditVisitDone');
          return;
        }
      });
    }

    var rosterDateSelect = document.getElementById('roster-date-select');
    if(rosterDateSelect){
      rosterDateSelect.value = rosterFilterVal;
      rosterDateSelect.addEventListener('change', function(){
        rosterFilterVal = rosterDateSelect.value;
        patchSignupUI();
      });
    }

    var printBtn = document.getElementById('print-roster-btn');
    if(printBtn){
      printBtn.addEventListener('click', function(){
        document.body.classList.add('printing-roster');
        window.print();
      });
      window.addEventListener('afterprint', function(){
        document.body.classList.remove('printing-roster');
      });
    }
  }

  function render(){
    document.getElementById('app-root').innerHTML = bodyHTML(state);
    wireEvents();
    autoCancelUnpaidSignups();
  }

  render();

  sheetsFetchAll(function(rows, requestRows, creditRows){
    if(rows) state.signups = rows.map(normalizeSheetRow);
    if(requestRows) state.classRequests = requestRows.map(normalizeRequestRow);
    if(creditRows) state.credits = creditRows.map(normalizeCreditRow);
    if(rows || requestRows || creditRows) patchSignupUI();
    autoCancelUnpaidSignups();
  });

  /* Keep checking while the page stays open, so an unpaid spot auto-cancels close to
     real time rather than only when someone happens to reload or reopen Staff. */
  setInterval(autoCancelUnpaidSignups, 60000);

  if(window.claude && typeof window.claude.use === 'function'){
    window.claude.use('artifact').then(function(cap){ artifactCap = cap; }).catch(function(){});
  }
})();
</script>
</body>
</html>
